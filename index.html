<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#0e0e0e">
<title>Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0e0e0e;color:#f0f0f0;font-family:'DM Sans',sans-serif;font-size:15px;overscroll-behavior:none}
  body{display:flex;flex-direction:column;height:100dvh}

  /* NAV */
  #nav{display:flex;background:#111;border-top:1px solid #222;padding:0;flex-shrink:0;position:fixed;bottom:0;left:0;right:0;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 8px;border:none;background:none;color:#555;font-size:10px;font-family:'DM Sans',sans-serif;cursor:pointer;border-top:2px solid transparent;transition:all .15s;gap:3px}
  .nav-btn.active{color:#C8873A;border-top-color:#C8873A}
  .nav-btn span.ico{font-size:22px;line-height:1}

  /* SCROLL BODY */
  #main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 14px 100px;max-width:480px;margin:0 auto;width:100%}

  /* HEADER */
  .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-top:env(safe-area-inset-top)}
  .page-title{font-size:20px;font-weight:800}
  .page-sub{font-size:12px;color:#555;text-align:right}
  .section-title{font-size:11px;font-weight:800;color:#666;text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px}

  /* DAY TABS */
  .day-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;scrollbar-width:none}
  .day-tabs::-webkit-scrollbar{display:none}
  .day-tab{padding:9px 14px;border-radius:10px;border:1.5px solid #2a2a2a;background:#161616;color:#555;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
  .day-tab.active{color:#fff}

  /* CARDS */
  .card{background:#161616;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #222}
  .card-sm{background:#161616;border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid #222}
  .note{background:#0d1722;border:1px solid #1f3a4a;color:#9fc4dd;font-size:13px;line-height:1.6}
  .banner{background:#1a1400;border:1px solid #3a2800;color:#E0A458;font-size:13px;line-height:1.5;border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .muted{color:#555}
  .dim{opacity:.45}

  /* EXERCISE */
  .ex-name{font-weight:700;font-size:14px;line-height:1.3;color:#f0f0f0}
  .ex-meta{font-size:12px;color:#666;margin-top:3px;line-height:1.5}
  .ex-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
  .block-tag{font-size:11px;font-weight:800;color:#0e0e0e;background:#C8873A;border-radius:6px;padding:2px 7px;margin-right:8px;flex-shrink:0}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:20px;margin:6px 6px 0 0}
  .pr-badge{background:#1a1200;color:#C8873A;border:1px solid #3a2800}
  .chest-badge{background:#2a1020;color:#E07AA8;border:1px solid #4a2038}
  .ss-badge{background:#10243a;color:#5BA8D4;border:1px solid #1f4a6b;font-weight:700}
  .coach{font-size:13px;line-height:1.5;border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#0f1a10;border:1px solid #1f3a22;color:#7BC67A}
  .coach.up{background:#1a1400;border-color:#5a3d00;color:#F0B060}
  .coach.warn{background:#1a0a0a;border-color:#4a1a1a;color:#cc6666}
  .prev{font-size:12px;color:#9a9a9a;background:#0e0e0e;border:1px solid #242424;border-radius:8px;padding:8px 10px;margin-bottom:10px}

  /* SET ROW */
  .set-head{display:grid;grid-template-columns:24px 1fr 1fr 48px;gap:6px;font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;text-align:center}
  .set-row{display:grid;grid-template-columns:24px 1fr 1fr 48px;gap:6px;align-items:center;margin-bottom:8px}
  .set-num{font-size:12px;color:#444;text-align:center}
  .set-input{background:#0e0e0e;border:1.5px solid #2a2a2a;border-radius:10px;color:#f0f0f0;font-size:17px;font-weight:700;font-family:'DM Sans',sans-serif;padding:12px 8px;text-align:center;width:100%;outline:none;transition:border-color .15s;-webkit-appearance:none}
  .set-input::placeholder{color:#4a4a4a}
  .set-input:focus{border-color:#C8873A88}
  .set-input.done{border-color:#C8873A55;background:#1a1000}
  .done-btn{width:48px;height:48px;border-radius:10px;border:1.5px solid #2a2a2a;background:#0e0e0e;color:#444;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
  .done-btn.active{background:#C8873A;border-color:#C8873A;color:#fff}

  /* RUN */
  .run-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
  .run-grid label,.nut-field label{display:block;font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;text-align:center}
  .check-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:#9fc4dd;margin:4px 0 10px}
  .toggle{padding:8px 12px;border-radius:10px;border:1.5px solid #1f4a6b;background:#0e0e0e;color:#5BA8D4;font-family:'DM Sans',sans-serif;font-weight:700;font-size:12px;cursor:pointer}
  .toggle.on{background:#5BA8D4;color:#0e0e0e}

  /* FEEDBACK */
  .feedback-box{background:#1a1400;border:1px solid #3a2800;border-radius:10px;padding:12px;margin-top:4px;font-size:13px;color:#C8873A;line-height:1.6}
  .feedback-box.good{background:#0a1a0a;border-color:#1a4a1a;color:#3A9B6F}
  .feedback-box.warn{background:#1a0a0a;border-color:#4a1a1a;color:#cc6666}

  /* DASHBOARD */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .stat-card{background:#161616;border:1px solid #222;border-radius:12px;padding:14px}
  .stat-val{font-size:24px;font-weight:800;line-height:1.1}
  .stat-label{font-size:11px;color:#666;margin-top:4px}
  .bw-row{display:flex;gap:8px;margin-bottom:12px}
  .bw-input,.ex-select{flex:1;background:#161616;border:1.5px solid #2a2a2a;border-radius:10px;color:#f0f0f0;font-size:16px;font-family:'DM Sans',sans-serif;padding:12px;outline:none;width:100%;-webkit-appearance:none}
  .ex-select{margin-bottom:12px}
  .add-btn,.btn{background:#C8873A;color:#0e0e0e;border:none;border-radius:10px;padding:12px 16px;font-weight:800;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;white-space:nowrap}
  .btn.ghost{background:#161616;color:#f0f0f0;border:1.5px solid #2a2a2a}
  .btn-row{display:flex;gap:8px}
  .btn-row .btn{flex:1}
  .goal-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
  .bar{height:7px;background:#222;border-radius:4px;overflow:hidden;margin-bottom:12px}
  .bar-fill{height:100%;border-radius:4px;transition:width .3s}
  .week-bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px}
  .week-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:#666;gap:4px}
  .week-bar div.b{width:100%;border-radius:5px 5px 2px 2px;background:#E07AA8}

  /* NUTRITION */
  .nut-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .nut-input{background:#0e0e0e;border:1.5px solid #2a2a2a;border-radius:10px;color:#f0f0f0;font-size:17px;font-weight:700;font-family:'DM Sans',sans-serif;padding:12px 8px;text-align:center;width:100%;outline:none;-webkit-appearance:none}
  .nut-input.filled{border-color:#C8873A55}
  .macro-row{margin-bottom:10px}
  .macro-label-row{display:flex;justify-content:space-between;margin-bottom:5px}
  .macro-bar{height:7px;background:#222;border-radius:4px;overflow:hidden}
  .macro-fill{height:100%;border-radius:4px}
  .history-row{display:flex;justify-content:space-between;align-items:center}

  /* REST DAY */
  .rest-day{text-align:center;padding:50px 20px}
  .rest-day .big{font-size:52px;margin-bottom:12px}
  .rest-day .title{font-size:18px;font-weight:800;margin-bottom:8px}
  .rest-day .sub{font-size:14px;color:#777;line-height:1.6}

  /* WAKE LOCK indicator */
  #wake-indicator{position:fixed;top:12px;right:14px;width:7px;height:7px;border-radius:50%;background:#3A9B6F;opacity:0;transition:opacity .3s;z-index:200}
  #wake-indicator.on{opacity:1}

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
</style>
</head>
<body>

<div id="wake-indicator"></div>

<div id="main"></div>

<nav id="nav">
  <button class="nav-btn active" data-view="training" onclick="setView('training')">
    <span class="ico">🏋️</span>Training
  </button>
  <button class="nav-btn" data-view="dashboard" onclick="setView('dashboard')">

  </button>

  </button>
  <button class="nav-btn" data-view="progress" onclick="setView('progress')">
    <span class="ico">📈</span>Progressie
  </button>
</nav>

// Tijdschatting: 5 min warming-up, ~45 sec per set (90 bij p/been), rust tussen sets, 1 min wisselen per oefening. Doel: 45 tot 60 min.
function estMin(dayKey){
  const day=SCHEMA[dayKey];if(!day||day.run||!day.exercises.length)return 0;
  let sec=300;
  for(const e of day.exercises){
    const work=e.repLabel==="p/been"?90:45;
    sec+=e.sets*work+Math.max(0,e.sets-1)*(e.rest||0)+60; // na de laatste set: wisselen i.p.v. rust
  }
  return Math.round(sec/60);
}
const EX={};
for(const d of DAYS)for(const e of SCHEMA[d].exercises)EX[e.id]={...e,day:d};

const SK="gym_v3";
function blank(){return{sessions:{},bodyweight:[],nutrition:{},steps:{},meta:{}}}
function load(){try{const r=localStorage.getItem(SK);const d=r?JSON.parse(r):blank();d.meta=d.meta||{};d.steps=d.steps||{};d.bodyweight=d.bodyweight||[];d.nutrition=d.nutrition||{};d.sessions=d.sessions||{};return d}catch{return blank()}}
function persist(){try{localStorage.setItem(SK,JSON.stringify(DB))}catch{}}

// ── DATUM (lokale tijd, niet UTC) ────────────────────────────────────────────
function ymd(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function today(){return ymd(new Date())}
function parseYmd(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function dayOf(date){return["Zo","Ma","Di","Wo","Do","Vr","Za"][parseYmd(date).getDay()]}
function todayDay(){return dayOf(today())}
function daysBetween(a,b){return Math.round((parseYmd(b)-parseYmd(a))/864e5)}
function programWeek(date=today()){return Math.max(1,Math.floor(daysBetween(PROGRAM_START,date)/7)+1)}
function weekStart(date){const d=parseYmd(date);const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return ymd(d)}
function addDays(date,n){const d=parseYmd(date);d.setDate(d.getDate()+n);return ymd(d)}
function fmtDate(s){const d=parseYmd(s);return`${d.getDate()}/${d.getMonth()+1}`}
function nl(n,dec=1){return(Math.round(n*10**dec)/10**dec).toString().replace(".",",")}

// ── DATA HELPERS ─────────────────────────────────────────────────────────────
function sessKey(day){return`${day}_${today()}`}
function getSession(day){return DB.sessions[sessKey(day)]||(DB.sessions[sessKey(day)]={date:today(),sets:{}},DB.sessions[sessKey(day)])}
function peekSession(day){return DB.sessions[sessKey(day)]||{date:today(),sets:{}}}
// Komma of punt: "72,5" en "72.5" worden allebei 72.5 (NL-toetsenbord op iPhone)
function num(v){return String(v??"").trim().replace(",",".").replace(/[^0-9.\-]/g,"")}
function setVal(day,exId,setIdx,field,val){
  if(field!=="z2")val=num(val);
  const s=getSession(day);
  if(!s.sets[exId])s.sets[exId]=[];
  while(s.sets[exId].length<=setIdx)s.sets[exId].push({weight:"",reps:"",done:false});
  s.sets[exId][setIdx][field]=val;save();
}
function toggleDone(day,exId,setIdx){
  const s=getSession(day);
  if(!s.sets[exId])s.sets[exId]=[];
  while(s.sets[exId].length<=setIdx)s.sets[exId].push({weight:"",reps:"",done:false});
  const set=s.sets[exId][setIdx];
  // Afvinken zonder invoer: neem het voorstel (placeholder) over
  if(!set.done){
    const ex=EX[exId];
    if(ex&&!ex.runSlot&&ex.runSlot!==0){
      const c=coach(ex);
      if(set.weight===""&&c&&c.target!=null&&ex.mode!=="core")set.weight=String(c.target);
      if(set.reps===""){const last=getLastFull(exId);const lr=last?.sets?.[setIdx]?.reps;set.reps=String(lr||ex.min)}
    }
  }
  set.done=!set.done;
  save();
  render();
}
function idsFor(exId){return[exId,...(EX[exId]?.alias||[])]}
// Laatste sessie van een oefening, over alle dagen heen (zodat historie meeverhuist met het schema)
function getLastFull(exId,{includeToday=false}={}){
  const ids=idsFor(exId);
  const keys=Object.keys(DB.sessions).sort((a,b)=>DB.sessions[b].date.localeCompare(DB.sessions[a].date));
  for(const k of keys){
    const s=DB.sessions[k];
    if(!includeToday&&s.date===today())continue;
    for(const id of ids){
      const sets=s.sets?.[id];
      if(sets&&sets.some(x=>x.done||x.weight||x.reps))return{sets,date:s.date};
    }
  }
  return null;
}
function allSetsOf(exId){
  const out=[];
  for(const k of Object.keys(DB.sessions)){
    const s=DB.sessions[k];
    for(const id of idsFor(exId)){
      for(const set of s.sets?.[id]||[]){if(set.done||(set.weight&&set.reps))out.push({...set,date:s.date})}
    }
  }
  return out;
}
function fmtSet(s,ex){
  const w=s.weight,r=s.reps;
  if(ex?.mode==="bw"){const extra=parseFloat(w)||0;return r?`${extra>0?"+"+w+"kg × ":"EG × "}${r}`:null}
  if(w&&r)return`${w}kg × ${r}`;
  if(w)return`${w}kg`;
  if(r)return`${r}`;
  return null;
}
function e1rm(w,r){w=parseFloat(w)||0;r=parseInt(r)||0;return w*(1+r/30)}
function setScore(set,ex){
  if(ex?.mode==="bw")return(parseFloat(set.weight)||0)*100+(parseInt(set.reps)||0);
  if(ex?.mode==="core")return parseInt(set.reps)||0;
  return e1rm(set.weight,set.reps);
}
function getPR(exId){
  const ex=EX[exId];let best=null;
  for(const set of allSetsOf(exId)){
    const v=setScore(set,ex);
    if(v>0&&(!best||v>best.val))best={val:v,weight:set.weight,reps:set.reps,date:set.date};
  }
  return best;
}
function getProgress(exId){
  const ex=EX[exId];const byDate={};
  for(const set of allSetsOf(exId)){
    const v=ex?.mode==="bw"||ex?.mode==="core"?(parseInt(set.reps)||0):e1rm(set.weight,set.reps);
    if(v>0)byDate[set.date]=Math.max(byDate[set.date]||0,v);
  }
  return Object.keys(byDate).sort().map(d=>({date:d,value:Math.round(byDate[d]*10)/10}));
}

// ── PROGRESSIE-COACH ─────────────────────────────────────────────────────────
// Double progression: alle sets op de bovenkant van de range → gewicht omhoog.
function coach(ex){
  if(ex.mode==="core")return null;
  const last=getLastFull(ex.id);
  if(ex.mode==="bw"){
    const top=ex.max;
    if(!last)return{target:0,cls:"",msg:`Fase 1: zoveel mogelijk eigen reps per set, aanvullen ${ex.id==="dips"?"met negatives":"met band"} tot ${ex.min} tot ${top}. Doel: ${ex.sets} x ${top} met eigen gewicht.`};
    const extra=Math.max(...last.sets.map(s=>parseFloat(s.weight)||0));
    const reps=last.sets.slice(0,ex.sets).map(s=>parseInt(s.reps)||0).filter(r=>r>0);
    const hit=reps.length>=Math.max(1,ex.sets-1)&&reps.every(r=>r>=top);
    if(hit)return{target:extra+2.5,cls:"up",msg:extra===0?`🎯 ${ex.sets} x ${top} met eigen gewicht gehaald. Fase 2: zet er 2,5 kg bij.`:`⬆️ Alle sets op ${top}+: vandaag +2,5 kg (totaal +${nl(extra+2.5)} kg).`};
    if(extra>0)return{target:extra,cls:"",msg:`Zelfde extra gewicht (+${nl(extra)} kg), mik op +1 rep per set tot ${top}.`};
    return{target:0,cls:"",msg:`Fase 1: vorige keer ${reps.join(" / ")}. Mik op +1 rep. Doel: ${ex.sets} x ${top} met eigen gewicht.`};
  }
  if(!last&&ex.start==null)return{target:null,cls:"",msg:`Eerste keer: kies een gewicht waarmee je ${ex.min} tot ${ex.max} strikte reps haalt, 1 tot 2 in de tank. Vanaf dan rekent de coach mee.`};
  if(!last)return{target:ex.start,cls:"",msg:`Startgewicht: ${nl(ex.start)} kg × ${ex.min} tot ${ex.max}.${ex.rampTo?` Daarna elke week +5 kg tot ~${ex.rampTo} kg (RPE 7).`:""}`};
  const done=last.sets.filter(s=>s.weight!==""||s.done);
  const w=done.length?Math.max(...done.map(s=>parseFloat(s.weight)||0)):(ex.start??0);
  // Telt ook als je vorige keer 1 set minder deed (bv. oud schema met 3 sets)
  const reps=last.sets.slice(0,ex.sets).map(s=>parseInt(s.reps)||0).filter(r=>r>0);
  const allHit=reps.length>=Math.max(1,ex.sets-1)&&reps.every(r=>r>=ex.max);
  const anyMiss=reps.some(r=>r>0&&r<ex.min);
  const stall=ex.chest?stallCheck(ex.id):null;
  if(ex.rampTo&&w<ex.rampTo&&!anyMiss){
    const t=Math.min(w+5,ex.rampTo);
    return{target:t,cls:"up",msg:`⬆️ Opbouwfase: ${nl(w)} → ${nl(t)} kg. Voelt het zwaarder dan RPE 7, blijf dan op ${nl(w)} kg.`};
  }
  if(allHit)return{target:w+ex.inc,cls:"up",msg:`⬆️ Vorige keer alle sets op ${ex.max}+. Vandaag ${nl(w+ex.inc)} kg.${stall?" "+stall:""}`};
  if(anyMiss)return{target:w,cls:"warn",msg:`Vorige keer onder de ${ex.min} reps (${reps.join(" / ")}). Blijf op ${nl(w)} kg, check slaap en eten. Twee keer op rij? Dan 1 stap terug.`};
  return{target:w,cls:stall?"warn":"",msg:`Zelfde gewicht (${nl(w)} kg), mik op +1 rep per set tot ${ex.max}. Vorige keer: ${reps.join(" / ")}.${stall?" "+stall:""}`};
}
// Chest: 6 weken geen e1RM-progressie → variatie wisselen
function stallCheck(exId){
  const pts=getProgress(exId);
  if(pts.length<4)return null;
  const span=daysBetween(pts[0].date,today());
  if(span<42)return null;
  const cutoff=addDays(today(),-42);
  const before=Math.max(...pts.filter(p=>p.date<cutoff).map(p=>p.value),0);
  const recent=Math.max(...pts.filter(p=>p.date>=cutoff).map(p=>p.value),0);
  return before>0&&recent<=before?"⚠️ 6 weken geen progressie: wissel naar een variatie (andere hoek of grip).":null;
}
function getFeedback(ex,curSets,lastSets){
  if(!lastSets||!curSets||ex.mode==="core")return null;
  const done=curSets.filter(s=>s.done);
  if(done.length<ex.sets)return null;
  const cur=Math.max(...done.map(s=>setScore(s,ex)));
  const prev=Math.max(...lastSets.map(s=>setScore(s,ex)));
  const curReps=done.reduce((a,s)=>a+(parseInt(s.reps)||0),0);
  const lastReps=lastSets.reduce((a,s)=>a+(parseInt(s.reps)||0),0);
  const curW=Math.max(...done.map(s=>parseFloat(s.weight)||0));
  const lastW=Math.max(...lastSets.map(s=>parseFloat(s.weight)||0));
  if(curW>lastW)return{msg:`🔥 +${nl(curW-lastW)} kg zwaarder dan vorige sessie.`,cls:"good"};
  if(curW===lastW&&curReps>lastReps)return{msg:`✅ +${curReps-lastReps} reps bij zelfde gewicht. Progressie.`,cls:"good"};
  if(cur<prev*0.95)return{msg:`⚠️ Lichter dan vorige sessie. Check herstel, slaap en voeding.`,cls:"warn"};
  return{msg:`➡️ Gelijk aan vorige sessie. Volgende keer +1 rep.`,cls:""};
}

// ── RUNS ─────────────────────────────────────────────────────────────────────
const RUN_IDS=["run_easy","run_comfort","run_long","zone2_run","interval_run"];
function paceOf(r){const m=parseFloat(r.min),k=parseFloat(r.km);return m>0&&k>0?m/k:null}
function fmtPace(p){if(!p)return"–";let m=Math.floor(p),s=Math.round((p-m)*60);if(s===60){m++;s=0}return`${m}:${String(s).padStart(2,"0")}`}
function allRuns(){
  const out=[];
  for(const k of Object.keys(DB.sessions)){
    const s=DB.sessions[k];
    for(const id of RUN_IDS){
      const r=s.sets?.[id]?.[0];
      if(!r)continue;
      const min=parseFloat(r.min||(id==="zone2_run"?r.reps:""))||0;
      if(min>0||parseFloat(r.km)>0)out.push({id,date:s.date,min,km:parseFloat(r.km)||0,hr:parseInt(r.hr)||0,z2:!!r.z2,done:!!r.done});
    }
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function runPlan(slot,week=programWeek()){const w=RUN_PLAN[Math.min(week,RUN_PLAN.length)-1];return w[slot]}
function runPlanKm(week=programWeek()){const w=RUN_PLAN[Math.min(week,RUN_PLAN.length)-1];return w.reduce((a,x)=>a+x.km,0)}

// ── CHART ────────────────────────────────────────────────────────────────────
function miniChart(data,color,{fmt=v=>v,goal=null,goalLabel="",invert=false}={}){
  if(!data||data.length<2)return`<div style="color:#444;font-size:12px;padding:12px 0">Log minimaal 2 keer voor een grafiek.</div>`;
  const W=340,H=100,P=12;
  const vals=data.map(d=>d.value).concat(goal!=null?[goal]:[]);
  const mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1;
  const y=v=>{const t=(v-mn)/range;return H-P-(invert?1-t:t)*(H-P*2)};
  const x=i=>P+(i/(data.length-1))*(W-P*2);
  const pts=data.map((d,i)=>`${x(i).toFixed(1)},${y(d.value).toFixed(1)}`).join(" ");
  const dots=data.map((d,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(d.value).toFixed(1)}" r="3.5" fill="${color}"/>`).join("");
  const goalLine=goal!=null?`<line x1="${P}" x2="${W-P}" y1="${y(goal).toFixed(1)}" y2="${y(goal).toFixed(1)}" stroke="#3A9B6F" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-P}" y="${(y(goal)-4).toFixed(1)}" font-size="10" fill="#3A9B6F" text-anchor="end">${goalLabel}</text>`:"";
  const last=data[data.length-1];
  return`<svg viewBox="0 0 ${W} ${H+4}" style="width:100%;display:block">
    ${goalLine}
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}
    <text x="${P}" y="${H+4}" font-size="10" fill="#555">${fmtDate(data[0].date)}</text>
    <text x="${W-P}" y="${H+4}" font-size="10" fill="#555" text-anchor="end">${fmtDate(last.date)} · ${fmt(last.value)}</text>
  </svg>`;
}

// ── VIEWS: TRAINING ──────────────────────────────────────────────────────────
function renderTraining(){
  const day=SCHEMA[activeDay];

    const active=d===activeDay;

  if(day.run){

    const hrWarn=ex.runSlot!==0&&parseInt(r.hr)>EASY_HR_CAP?`<div class="feedback-box warn">Gemiddelde hartslag ${r.hr}: te hard voor een rustige run. Volgende keer langzamer, ook als het tempo dan rond 7:30 zit. Rustig = sneller herstel = betere intervallen.</div>`:(ex.runSlot!==0&&parseInt(r.hr)>0?`<div class="feedback-box good">Mooi rustig gehouden.</div>`:"");

        <div><label>Minuten</label><input class="set-input${isDone?" done":""}" type="text" inputmode="decimal" autocomplete="off" placeholder="min" value="${r.min||""}" onchange="setVal('${activeDay}','${ex.id}',0,'min',this.value);render()" onfocus="this.select()"></div>
        <div><label>Km</label><input class="set-input${isDone?" done":""}" type="text" inputmode="decimal" autocomplete="off" placeholder="km" value="${r.km||""}" onchange="setVal('${activeDay}','${ex.id}',0,'km',this.value);render()" onfocus="this.select()"></div>
        <div><label>Gem. HR</label><input class="set-input${isDone?" done":""}" type="number" inputmode="numeric" placeholder="bpm" value="${r.hr||""}" onchange="setVal('${activeDay}','${ex.id}',0,'hr',this.value);render()" onfocus="this.select()"></div>

function toggleZ2(day,exId){
  const s=getSession(day);

// ── CHEST-VOLUME ─────────────────────────────────────────────────────────────
function chestTarget(week){return 12} // incline smith 3 + cable fly 2 + low-incline DB 2 + dips 3 + pec deck 2
function chestSetsInWeek(ws){
  const we=addDays(ws,6);let n=0;
  for(const k of Object.keys(DB.sessions)){
    const s=DB.sessions[k];
    if(s.date<ws||s.date>we)continue;
    for(const[id,sets]of Object.entries(s.sets||{})){
      const ex=EX[id]||Object.values(EX).find(e=>e.alias?.includes(id));
      if(ex?.chest)n+=sets.filter(x=>x.done).length;
    }
  }
  return n;
}

// ── LICHAAMSGEWICHT ──────────────────────────────────────────────────────────
function bwAvg(from,to){
  const v=DB.bodyweight.filter(b=>b.date>=from&&b.date<=to).map(b=>b.weight);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}
function bwStatus(){
  const t=today();
  const cur=bwAvg(addDays(t,-6),t);
  const prev=bwAvg(addDays(t,-13),addDays(t,-7));
  const first=DB.bodyweight[0]?.date;
  if(cur==null)return{cur:null};
  if(prev==null||!first||daysBetween(first,t)<13)return{cur,msg:"Weeg elke ochtend. Na 2 weken zie je hier of je gewicht stabiel blijft (recomp: 0 tot +0,2 kg per week).",cls:""};
  const rate=cur-prev;
  const sign=rate>=0?"+":"";
  let msg,cls;
  if(rate<-0.2){msg=`Weekgemiddelde ${sign}${nl(rate,2)} kg. Je valt af, dan word je platter: eet +200 kcal per dag.`;cls="warn"}
  else if(rate>0.3){msg=`Weekgemiddelde ${sign}${nl(rate,2)} kg. Te snel omhoog: eet −150 kcal per dag.`;cls="warn"}
  else{msg=`Weekgemiddelde ${sign}${nl(rate,2)} kg. Op koers voor de recomp, zo laten. Check ook de spiegel elke 4 weken.`;cls="good"}
  return{cur,rate,msg,cls};
}

// ── VIEWS: VOEDING ───────────────────────────────────────────────────────────
function calcDayScore(nut,steps,goals){
  if(!nut)return null;
  const p=parseFloat(nut.protein)||0,k=parseFloat(nut.carbs)||0,v=parseFloat(nut.fat)||0;
  const kcalIn=parseFloat(nut.kcal)||Math.round(p*4+k*4+v*9);
  const st=parseInt(steps)||0;
  let scored=0,total=0;
  if(p>0){const r=p/goals.protein;scored+=r>=0.92&&r<=1.15?25:r>=0.80?15:r>=0.65?8:2;total+=25}
  // Recomp: dicht bij het doel blijven telt het zwaarst
  if(kcalIn>0){const r=kcalIn/goals.kcal;scored+=r>=0.95&&r<=1.05?25:r>=0.90&&r<=1.10?16:r>=0.80?7:2;total+=25}
  if(k>0){const r=k/goals.carbs;scored+=r>=0.88&&r<=1.12?10:r>=0.70?6:3;total+=10}
  if(v>0){const r=v/goals.fat;scored+=r>=0.85&&r<=1.20?5:3;total+=5}
  if(st>0){scored+=st>=10000?15:st>=8000?13:st>=6000?9:st>=4000?5:2;total+=15}
  if(total===0)return null;
  return Math.min(Math.round((scored/total)*100)/10,10);
}
function scoreColor(s){if(s>=9)return"#3A9B6F";if(s>=7.5)return"#7BC67A";if(s>=6)return"#C8873A";if(s>=4.5)return"#cc8833";return"#cc4444"}
function scoreLabel(s){if(s>=9)return"Perfecte dag 🔥";if(s>=7.5)return"Sterke dag ✅";if(s>=6)return"Redelijke dag";if(s>=4.5)return"Matige dag ⚠️";return"Zwakke dag ❌"}

function renderNutrition(){
  const nutKey=today();
  const nut=DB.nutrition[nutKey]||{};
  const steps=DB.steps?.[nutKey]||"";
  const goals=macrosFor(nutKey);
  const isRun=goals===MACROS_RUN;
  const p=parseFloat(nut.protein)||0,k=parseFloat(nut.carbs)||0,v=parseFloat(nut.fat)||0;
  const kcal=parseFloat(nut.kcal)||0;
  const calcKcal=Math.round(p*4+k*4+v*9);
  const st=parseInt(steps)||0;
  const score=calcDayScore(nut,steps,goals);
  const bar=(val,goal,color)=>`<div class="macro-bar"><div class="macro-fill" style="width:${Math.min((val/goal)*100,100)}%;background:${color}"></div></div>`;
  const macros=[
    {field:"protein",label:"Eiwit",unit:"g",color:"#C8873A",val:p,goal:goals.protein},
    {field:"carbs",label:"Koolhydraten",unit:"g",color:"#7B6FD4",val:k,goal:goals.carbs},
    {field:"fat",label:"Vetten",unit:"g",color:"#3A9B6F",val:v,goal:goals.fat},
    {field:"kcal",label:"Calorieën",unit:"kcal",color:"#888",val:kcal||calcKcal,goal:goals.kcal},
  ];
  const feedbackLines=[];
  for(const m of macros){
    if(!m.val)continue;
    const diff=m.val-m.goal,pct=Math.round((m.val/m.goal)*100);
    let msg,col;
    if(pct>=92&&pct<=108){msg=`✅ ${m.label} op schema`;col="#3A9B6F"}
    else if(m.val<m.goal){msg=`⬇️ ${m.label} ${Math.abs(diff).toFixed(0)}${m.unit} te laag${m.field==="kcal"?": te weinig eten maakt je plat":""}`;col="#C8873A"}
    else{msg=`⬆️ ${m.label} ${Math.abs(diff).toFixed(0)}${m.unit} te hoog`;col="#7B6FD4"}
    feedbackLines.push({msg,col});
  }
  if(st>0){
    if(st>=STEPS_GOAL)feedbackLines.push({msg:`✅ Stappen: ${st.toLocaleString("nl")}`,col:"#3A9B6F"});
    else feedbackLines.push({msg:`➡️ Stappen: ${st.toLocaleString("nl")}, doel ${STEPS_GOAL.toLocaleString("nl")}+`,col:"#C8873A"});
  }
  const feedbackHtml=feedbackLines.map((f,i)=>`<div style="font-size:13px;color:${f.col};padding:6px 0;border-bottom:${i<feedbackLines.length-1?"1px solid #1c1c1c":"none"}">${f.msg}</div>`).join("");
  const scoreHtml=score!==null?`<div style="display:flex;align-items:center;justify-content:space-between;background:#111;border-radius:12px;padding:14px 16px;margin-bottom:12px;border:1px solid #222">
    <div><div style="font-size:11px;color:#555;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Dagcijfer</div>
    <div style="font-size:13px;color:${scoreColor(score)}">${scoreLabel(score)}</div></div>
    <div style="font-size:48px;font-weight:800;color:${scoreColor(score)};line-height:1">${score.toFixed(1)}</div></div>`:"";

  // Consistentie: gemiddelde kcal laatste 7 gelogde dagen vs doel
  const history=Object.entries(DB.nutrition).sort(([a],[b])=>b.localeCompare(a)).slice(0,7);
  const kcalOf=n=>parseFloat(n.kcal)||Math.round((parseFloat(n.protein)||0)*4+(parseFloat(n.carbs)||0)*4+(parseFloat(n.fat)||0)*9);
  const logged=history.filter(([,n])=>kcalOf(n)>0);
  const consist=logged.length>=3?(()=>{const devs=logged.map(([d,n])=>Math.abs(kcalOf(n)-macrosFor(d).kcal));const avg=devs.reduce((a,b)=>a+b,0)/devs.length;return`<div class="feedback-box ${avg<=200?"good":avg<=400?"":"warn"}" style="margin-bottom:12px">Consistentie (${logged.length} dagen): gemiddeld ${Math.round(avg)} kcal naast je doel. ${avg<=200?"Strak.":"Doel: binnen 200 kcal. Een vast dagmenu helpt het meest."}</div>`})():"";

  const histHtml=history.map(([date,n])=>{
    const pp=parseFloat(n.protein)||0,kk=parseFloat(n.carbs)||0,vv=parseFloat(n.fat)||0;
    const kc=kcalOf(n),g=macrosFor(date);
    const st2=parseInt(DB.steps?.[date])||0;
    const sc=calcDayScore(n,DB.steps?.[date],g);
    return`<div class="card-sm"><div class="history-row">
      <div><div style="font-size:13px;font-weight:700;color:${date===nutKey?"#C8873A":"#f0f0f0"}">${fmtDate(date)} ${dayOf(date)}${date===nutKey?" · vandaag":""}</div>
      <div style="font-size:11px;color:#555;margin-top:2px">P${pp} · K${kk} · V${vv}${st2?` · 👟${st2.toLocaleString("nl")}`:""}</div></div>
      <div style="text-align:right"><div style="font-weight:800;font-size:14px">${kc} <span style="font-size:11px;color:#555">/ ${g.kcal}</span></div>
      ${sc!==null?`<div style="font-size:14px;font-weight:800;color:${scoreColor(sc)};margin-top:2px">${sc.toFixed(1)}</div>`:""}</div>
    </div></div>`;
  }).join("");

  return`<div class="page-header"><div class="page-title">Voeding</div><div class="page-sub">${isRun?"🏃 Loopdag":"🏋️ Krachtdag"}<br>${goals.kcal} kcal · P${goals.protein} K${goals.carbs} V${goals.fat}</div></div>
  ${scoreHtml}
  <div class="card">
    <div style="font-weight:800;font-size:15px;margin-bottom:14px">Vandaag <span style="font-size:11px;font-weight:400;color:#555">${fmtDate(nutKey)}</span></div>
    <div class="nut-grid">
      ${macros.map(m=>`<div class="nut-field"><label style="color:${m.color}">${m.label} (${m.unit})</label>
        <input class="nut-input${nut[m.field]?" filled":""}" type="text" inputmode="decimal" autocomplete="off" placeholder="doel: ${m.goal}" value="${nut[m.field]||""}" onchange="updateNut('${m.field}',this.value)"></div>`).join("")}
      <div class="nut-field" style="grid-column:1/-1"><label style="color:#888">👟 Stappen</label>

    ${macros.map(m=>`<div class="macro-row"><div class="macro-label-row"><span style="color:#666;font-size:12px">${m.label}</span>

  <div class="card note">${isRun?"Loopdag: koolhydraten rond je run plannen. Lange run: 30 tot 60 g koolhydraten vooraf.":"Krachtdag: iets kleins vooraf (banaan + whey), grote maaltijd direct na de training."} Creatine 5 g per dag.</div>
  <div class="section-title">Laatste 7 dagen</div>
  ${consist}
  ${histHtml||`<div style="color:#444;font-size:13px;padding:8px 0">Nog niets gelogd.</div>`}`;
}

// ── VIEWS: PROGRESSIE ────────────────────────────────────────────────────────
function renderProgress(){
  const allEx=Object.values(EX).filter(e=>!e.run&&e.runSlot===undefined);
  const opts=allEx.map(ex=>`<option value="${ex.id}"${progressEx===ex.id?" selected":""}>${ex.chest?"💗 ":""}${ex.name}</option>`).join("");
  let chartHtml="";
  if(progressEx){
    const ex=EX[progressEx];
    const pts=getProgress(progressEx);
    const pr=getPR(progressEx);
    const isLoad=ex.mode!=="bw"&&ex.mode!=="core";
    const stall=ex.chest?stallCheck(ex.id):null;
    chartHtml=`<div class="card">
      <div style="font-weight:700;margin-bottom:4px">${ex.name}</div>
      <div class="ex-meta" style="margin-bottom:8px">${isLoad?"Geschatte 1RM (e1RM) per sessie: combineert gewicht en reps.":"Beste reps per sessie."}</div>
      ${pr?`<span class="pill pr-badge" style="margin:0 0 10px">🏆 ${fmtSet(pr,ex)} · ${fmtDate(pr.date)}</span>`:""}
      ${miniChart(pts,SCHEMA[ex.day].color,{fmt:v=>isLoad?nl(v)+" kg":v+" reps"})}
      ${stall?`<div class="feedback-box warn" style="margin-top:8px">${stall}</div>`:""}
    </div>`;
  }
  const volHtml=DAYS.filter(d=>SCHEMA[d].exercises.length>0&&!SCHEMA[d].run).map(d=>{
    const ids=SCHEMA[d].exercises.map(e=>e.id);
    const keys=Object.keys(DB.sessions).filter(k=>ids.some(id=>DB.sessions[k].sets?.[id]?.some(s=>s.done))).sort((a,b)=>DB.sessions[b].date.localeCompare(DB.sessions[a].date));
    const last=keys[0]?DB.sessions[keys[0]]:null;
    const sets=last?ids.reduce((a,id)=>a+(last.sets?.[id]||[]).filter(s=>s.done).length,0):0;
    const planned=SCHEMA[d].exercises.reduce((a,e)=>a+e.sets,0);
    return`<div class="card-sm" style="display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-weight:700;font-size:13px">${SCHEMA[d].type}</div><div style="font-size:11px;color:#555">${SCHEMA[d].label}</div></div>
      <div style="text-align:right"><div style="font-weight:800;color:${sets>0?SCHEMA[d].color:"#333"}">${sets>0?`${sets} / ${planned} sets`:"–"}</div>
      <div style="font-size:10px;color:#555">${last?fmtDate(last.date):"Nog niet gelogd"}</div></div>
    </div>`;
  }).join("");
  return`<div class="page-header"><div class="page-title">Progressie</div></div>
  <div class="section-title">Oefening</div>
  <select class="ex-select" onchange="progressEx=this.value;render()"><option value="">Kies een oefening...</option>${opts}</select>
  ${chartHtml}
  <div class="section-title">Laatste sessie per workout</div>
  ${volHtml}`;
}

// ── BACKUP ───────────────────────────────────────────────────────────────────
function backupDue(){
  const hasData=Object.keys(DB.sessions).length>0;
  if(!hasData)return false;
  if(syncCfg()&&DB.meta.lastSync&&daysBetween(ymd(new Date(DB.meta.lastSync)),today())<7)return false;
  return!DB.meta.lastBackup||daysBetween(DB.meta.lastBackup,today())>=7;
}
async function exportData(){
  const prev=DB.meta.lastBackup||null;
  DB.meta.lastBackup=today();save();
  const json=JSON.stringify(DB,null,1);
  const name=`training-backup-${today()}.json`;
  try{
    const file=new File([json],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});render();return}
  }catch(e){if(e.name==="AbortError"){DB.meta.lastBackup=prev;save();render();return}}
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  render();
}
function importData(input){
  const f=input.files?.[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d||typeof d!=="object"||!d.sessions)throw new Error("geen trainingsdata");
      const n=Object.keys(d.sessions).length;
      if(!confirm(`Backup met ${n} sessies en ${(d.bodyweight||[]).length} gewichtsmetingen terugzetten? Je huidige data op dit apparaat wordt overschreven.`))return;
      DB=d;DB.meta=DB.meta||{};DB.steps=DB.steps||{};DB.bodyweight=DB.bodyweight||[];DB.nutrition=DB.nutrition||{};
      save();render();alert("Backup teruggezet.");
    }catch(e){alert("Dit bestand kan ik niet lezen: "+e.message)}
    input.value="";
  };
  rd.readAsText(f);
}

// ── AUTOMATISCHE BACKUP (privé GitHub-repo) ──────────────────────────────────
// Elke wijziging wordt na 15 sec gesynct naar data/latest.json, en elke week krijgt een eigen
// bestand data/weeks/week-JJJJ-MM-DD.json (maandag van die week). Token staat alleen op dit apparaat,
// onder een eigen sleutel, en gaat nooit mee in exports of in de code.
const SYNC_KEY="gym_sync";
function syncCfg(){try{const c=JSON.parse(localStorage.getItem(SYNC_KEY));return c&&c.repo&&c.token?c:null}catch{return null}}
function setSyncCfg(c){try{c?localStorage.setItem(SYNC_KEY,JSON.stringify(c)):localStorage.removeItem(SYNC_KEY)}catch{}}
let syncTimer=null,syncBusy=false,syncError="";
function scheduleSync(delay=15000){if(!syncCfg())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),delay)}
function b64(str){return btoa(unescape(encodeURIComponent(str)))}
function ghHeaders(cfg){return{Authorization:`Bearer ${cfg.token}`,Accept:"application/vnd.github+json"}}
async function ghPut(cfg,path,content,msg){
  const url=`https://api.github.com/repos/${cfg.repo}/contents/${path}`;
  let sha;
  const g=await fetch(`${url}?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`,{headers:ghHeaders(cfg),cache:"no-store"});
  if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error(`lezen mislukt (${g.status})`);
  const body={message:msg,content:b64(content),branch:cfg.branch};if(sha)body.sha=sha;
  const r=await fetch(url,{method:"PUT",headers:ghHeaders(cfg),body:JSON.stringify(body)});
  if(!r.ok)throw new Error(`opslaan mislukt (${r.status})`);
}
async function syncNow(){
  const cfg=syncCfg();if(!cfg||syncBusy)return;
  clearTimeout(syncTimer);syncBusy=true;syncError="";
  try{
    const json=JSON.stringify(DB,null,1);
    await ghPut(cfg,"data/latest.json",json,`Sync ${today()}`);
    const ws=weekStart(today());
    await ghPut(cfg,`data/weeks/week-${ws}.json`,json,`Weekbackup ${ws}`);
    DB.meta.lastSync=new Date().toISOString();DB.meta.lastBackup=today();persist();
  }catch(e){syncError=e.message||"onbekende fout"}
  syncBusy=false;
  if(currentView==="dashboard")render();
}
async function connectSync(){
  const repo=(document.getElementById("sync-repo")?.value||"").trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,"");
  const token=(document.getElementById("sync-token")?.value||"").trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token){alert("Vul je repo in als naam/repo en plak je token.");return}
  try{
    const r=await fetch(`https://api.github.com/repos/${repo}`,{headers:ghHeaders({token}),cache:"no-store"});
    if(!r.ok)throw new Error(r.status===404?"repo niet gevonden, of het token heeft er geen toegang toe":`GitHub ${r.status}`);
    const info=await r.json();
    if(!info.private){alert("Deze repo is openbaar. Je trainings-, gewicht- en voedingsdata horen in een privé repo. Maak hem privé en probeer opnieuw.");return}
    setSyncCfg({repo,token,branch:info.default_branch||"main"});
    await syncNow();
    alert(syncError?`Gekoppeld, maar de eerste sync lukte niet: ${syncError}`:"Gekoppeld. Je data wordt nu automatisch opgeslagen.");
  }catch(e){alert("Koppelen mislukt: "+e.message)}
}
function disconnectSync(){if(confirm("Automatische backup uitzetten? Je token wordt van dit apparaat verwijderd.")){setSyncCfg(null);render()}}
function syncCardHtml(){
  const cfg=syncCfg();
  if(cfg){
    const last=DB.meta.lastSync?new Date(DB.meta.lastSync):null;
    const lastTxt=last?`${fmtDate(ymd(last))} ${String(last.getHours()).padStart(2,"0")}:${String(last.getMinutes()).padStart(2,"0")}`:"nog niet";
    return`<div class="ex-meta" style="margin-bottom:12px">☁️ Automatische backup naar <strong style="color:#f0f0f0">${cfg.repo}</strong> (privé).<br>
      Elke wijziging na 15 sec, plus een weekbestand per week.<br>Laatste sync: <strong style="color:${syncError?"#cc6666":"#3A9B6F"}">${syncBusy?"bezig...":lastTxt}</strong>${syncError?`<br><span style="color:#cc6666">Fout: ${syncError}</span>`:""}</div>
      <div class="btn-row"><button class="btn" onclick="syncNow()">☁️ Nu syncen</button><button class="btn ghost" onclick="disconnectSync()">Ontkoppel</button></div>`;
  }
  return`<div class="ex-meta" style="margin-bottom:10px">☁️ <strong style="color:#f0f0f0">Automatische backup:</strong> koppel een privé GitHub-repo, dan wordt alles vanzelf opgeslagen, met een apart bestand per week.</div>
    <input class="bw-input" id="sync-repo" placeholder="casnieuwdorp/training-data" autocomplete="off" autocapitalize="off" style="margin-bottom:8px">
    <input class="bw-input" id="sync-token" type="password" placeholder="GitHub token (alleen Contents: read/write)" autocomplete="off" style="margin-bottom:8px">
    <button class="btn" style="width:100%" onclick="connectSync()">Koppel</button>`;
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  const main=document.getElementById("main");
  const y=main.scrollTop;
  if(currentView==="training")main.innerHTML=renderTraining();
  else if(currentView==="dashboard")main.innerHTML=renderDashboard();
  else if(currentView==="nutrition")main.innerHTML=renderNutrition();
  else if(currentView==="progress")main.innerHTML=renderProgress();
  main.scrollTop=y;
}
function setView(v){
  currentView=v;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
  if(v==="training")requestWake();else releaseWake();
  render();document.getElementById("main").scrollTop=0;
}
function switchDay(d){activeDay=d;render();document.getElementById("main").scrollTop=0;scrollTabIntoView()}
function scrollTabIntoView(){const t=document.querySelector(".day-tab.active");if(t)t.scrollIntoView({inline:"center",block:"nearest"})}

function logBW(){
  const inp=document.getElementById("bw-input");
  const w=parseFloat(num(inp?.value));
  if(!w)return;
  // één meting per dag: overschrijf als je vandaag al gewogen hebt
  DB.bodyweight=DB.bodyweight.filter(b=>b.date!==today());
  DB.bodyweight.push({date:today(),weight:w});
  DB.bodyweight.sort((a,b)=>a.date.localeCompare(b.date));
  save();render();
}
function updateNut(field,val){
  const key=today();
  DB.nutrition[key]=DB.nutrition[key]||{};
  DB.nutrition[key][field]=num(val);
  save();render();
}
function updateSteps(val){DB.steps[today()]=num(val);save();render()}

// ── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&syncTimer&&syncCfg())syncNow()});
if(syncCfg()&&(!DB.meta.lastSync||daysBetween(ymd(new Date(DB.meta.lastSync)),today())>=1))scheduleSync(3000);
requestWake();
render();
scrollTabIntoView();
</script>
