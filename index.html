<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#0e0e0e">
<title>Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0e0e0e;color:#f0f0f0;font-family:'DM Sans',sans-serif;font-size:15px;overscroll-behavior:none}
  body{display:flex;flex-direction:column;height:100dvh}
  
  /* NAV */
  #nav{display:flex;background:#111;border-top:1px solid #222;padding:0;flex-shrink:0;position:fixed;bottom:0;left:0;right:0;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 8px;border:none;background:none;color:#555;font-size:10px;font-family:'DM Sans',sans-serif;cursor:pointer;border-top:2px solid transparent;transition:all .15s;gap:3px}
  .nav-btn.active{color:#C8873A;border-top-color:#C8873A}
  .nav-btn span.ico{font-size:22px;line-height:1}

  /* SCROLL BODY */
  #main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 14px 100px;max-width:480px;margin:0 auto;width:100%}

  /* HEADER */
  .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-top:env(safe-area-inset-top)}
  .page-title{font-size:20px;font-weight:800}
  .page-sub{font-size:12px;color:#555}

  /* DAY TABS */
  .day-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;scrollbar-width:none}
  .day-tabs::-webkit-scrollbar{display:none}
  .day-tab{padding:9px 14px;border-radius:10px;border:1.5px solid #2a2a2a;background:#161616;color:#555;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
  .day-tab.active{color:#fff}

  /* CARDS */
  .card{background:#161616;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #222}
  .card-sm{background:#161616;border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid #222}

  /* EXERCISE */
  .ex-name{font-weight:700;font-size:14px;line-height:1.3;color:#f0f0f0}
  .ex-meta{font-size:12px;color:#555;margin-top:3px}
  .ex-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
  .last-tag{font-size:11px;background:#1e1e1e;color:#777;padding:4px 10px;border-radius:20px;border:1px solid #2a2a2a;white-space:nowrap;flex-shrink:0;margin-left:8px}
  .pr-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:#1a1200;color:#C8873A;padding:3px 9px;border-radius:20px;border:1px solid #3a2800;margin-top:5px}

  /* SET ROW */
  .set-row{display:grid;grid-template-columns:24px 1fr 1fr 48px;gap:6px;align-items:center;margin-bottom:8px}
  .set-num{font-size:12px;color:#444;text-align:center}
  .set-input{background:#0e0e0e;border:1.5px solid #2a2a2a;border-radius:10px;color:#f0f0f0;font-size:17px;font-weight:700;font-family:'DM Sans',sans-serif;padding:12px 8px;text-align:center;width:100%;outline:none;transition:border-color .15s;-webkit-appearance:none}
  .set-input:focus{border-color:#C8873A44}
  .set-input.done{border-color:#C8873A55;background:#1a1000}
  .done-btn{width:48px;height:48px;border-radius:10px;border:1.5px solid #2a2a2a;background:#0e0e0e;color:#444;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
  .done-btn.active{background:#C8873A;border-color:#C8873A;color:#fff}

  /* FEEDBACK */
  .feedback-box{background:#1a1400;border:1px solid #3a2800;border-radius:10px;padding:12px;margin-top:10px;font-size:13px;color:#C8873A;line-height:1.6}
  .feedback-box.good{background:#0a1a0a;border-color:#1a4a1a;color:#3A9B6F}
  .feedback-box.warn{background:#1a0a0a;border-color:#4a1a1a;color:#cc6666}

  /* WAKE LOCK indicator */
  #wake-indicator{position:fixed;top:12px;right:14px;width:7px;height:7px;border-radius:50%;background:#3A9B6F;opacity:0;transition:opacity .3s;z-index:200}
  #wake-indicator.on{opacity:1}

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
</style>
</head>
<body>

<div id="wake-indicator"></div>

<div id="main"></div>

<nav id="nav">
  <button class="nav-btn active" data-view="training" onclick="setView('training')">
    <span class="ico">🏋️</span>Training
  </button>
  <button class="nav-btn" data-view="dashboard" onclick="setView('dashboard')">
    <span class="ico">📊</span>Dashboard
  </button>
  <button class="nav-btn" data-view="nutrition" onclick="setView('nutrition')">
    <span class="ico">🥩</span>Voeding
  </button>
  <button class="nav-btn" data-view="progress" onclick="setView('progress')">
    <span class="ico">📈</span>Progressie
  </button>
</nav>

<script>
// ── SCHEMA ──────────────────────────────────────────────────────────────────
const SCHEMA = {
  Ma:{label:"Maandag",type:"Push 1",color:"#C8873A",exercises:[
    {id:"bench",name:"Barbell Bench Press",sets:4,reps:"5–7",rest:180},
    {id:"incline_db",name:"Incline DB Press",sets:3,reps:"9–11",rest:150},
    {id:"cable_fly",name:"Cable Fly",sets:3,reps:"12–15",rest:90},
    {id:"shoulder_press",name:"Seated DB Shoulder Press",sets:3,reps:"9–11",rest:150},
    {id:"lateral_raise",name:"Lateral Raise (cable)",sets:3,reps:"13–15",rest:90},
    {id:"pushdown",name:"Cable Tricep Pushdown",sets:3,reps:"12–15",rest:90},
  ]},
  Di:{label:"Dinsdag",type:"Pull 1",color:"#3A9B6F",exercises:[
    {id:"pullups",name:"Weighted Pull Ups",sets:4,reps:"6–9",rest:180},
    {id:"row_pendlay",name:"Barbell Row (Pendlay)",sets:4,reps:"7–9",rest:150},
    {id:"db_row",name:"Single Arm DB Row",sets:3,reps:"10–12",rest:120},
    {id:"face_pull",name:"Face Pull (cable)",sets:3,reps:"15–20",rest:90},
    {id:"incline_curl",name:"Incline DB Curl",sets:3,reps:"10–12",rest:90},
    {id:"hammer_curl",name:"Hammer Curl (cable)",sets:3,reps:"10–12",rest:90},
  ]},
  Wo:{label:"Woensdag",type:"Legs 1",color:"#7B6FD4",exercises:[
    {id:"hack_squat",name:"Hack Squat",sets:4,reps:"8–10",rest:210},
    {id:"rdl",name:"Romanian Deadlift",sets:4,reps:"8–10",rest:180},
    {id:"leg_ext",name:"Leg Extension",sets:3,reps:"12–15",rest:120},
    {id:"leg_curl_s",name:"Leg Curl (seated)",sets:3,reps:"12–15",rest:120},
    {id:"standing_calf",name:"Standing Calf Raise",sets:4,reps:"12–15",rest:90},
    {id:"seated_calf",name:"Seated Calf Raise",sets:3,reps:"15–20",rest:90},
  ]},
  Do:{label:"Donderdag",type:"Push 2",color:"#C8873A",exercises:[
    {id:"dips",name:"Weighted Dips",sets:4,reps:"8–10",rest:180},
    {id:"incline_smith",name:"Incline Smith Press",sets:3,reps:"10–12",rest:150},
    {id:"leaning_lateral",name:"Leaning Lateral Raise",sets:3,reps:"15",rest:90},
    {id:"rear_delt",name:"Rear Delt Fly",sets:3,reps:"15–20",rest:90},
    {id:"overhead_ext",name:"Overhead Tricep Extension",sets:3,reps:"12–15",rest:120},
    {id:"skull_crusher",name:"Skull Crusher (EZ bar)",sets:3,reps:"10–12",rest:120},
  ]},
  Vr:{label:"Vrijdag",type:"Pull 2",color:"#3A9B6F",exercises:[
    {id:"pullups2",name:"Pull Ups (bodyweight)",sets:4,reps:"10–12",rest:150},
    {id:"cable_row",name:"Seated Cable Row (wide)",sets:4,reps:"10–12",rest:150},
    {id:"lat_pulldown",name:"Lat Pulldown (close grip)",sets:3,reps:"12–14",rest:120},
    {id:"shrug",name:"Cable Shrug",sets:3,reps:"12–15",rest:90},
    {id:"bb_curl",name:"Barbell Curl",sets:3,reps:"8–10",rest:120},
    {id:"conc_curl",name:"Cable Concentration Curl",sets:3,reps:"12–15",rest:90},
  ]},
  Za:{label:"Zaterdag",type:"Legs 2 + Core",color:"#7B6FD4",exercises:[
    {id:"rdl2",name:"Romanian Deadlift (zwaar)",sets:4,reps:"7–9",rest:210},
    {id:"hack_squat2",name:"Hack Squat (voeten hoog)",sets:3,reps:"10–12",rest:180},
    {id:"leg_curl_l",name:"Lying Leg Curl",sets:4,reps:"10–12",rest:120},
    {id:"leg_press",name:"Leg Press (voeten laag)",sets:3,reps:"12–15",rest:120},
    {id:"cable_crunch",name:"Cable Crunch",sets:4,reps:"15–20",rest:60},
    {id:"hanging_leg",name:"Hanging Leg Raise",sets:3,reps:"12–15",rest:60},
    {id:"ab_wheel",name:"Ab Wheel Rollout",sets:3,reps:"10–12",rest:60},
  ]},
  Zo:{label:"Zondag",type:"Rust",color:"#555",exercises:[]}
};
const DAYS=["Ma","Di","Wo","Do","Vr","Za","Zo"];
const MACROS={kcal:2400,protein:195,carbs:220,fat:70};

// ── STATE ────────────────────────────────────────────────────────────────────
const SK="gym_v3";
function load(){try{const r=localStorage.getItem(SK);return r?JSON.parse(r):{sessions:{},bodyweight:[],nutrition:{}}}catch{return{sessions:{},bodyweight:[],nutrition:{}}}}
function save(){try{localStorage.setItem(SK,JSON.stringify(DB))}catch{}}
let DB=load();

function today(){return new Date().toISOString().slice(0,10)}
function todayDay(){return["Zo","Ma","Di","Wo","Do","Vr","Za"][new Date().getDay()]}

let currentView="training";
let activeDay=todayDay();
let progressEx="";

// ── WAKE LOCK ────────────────────────────────────────────────────────────────
let wakeLock=null;
async function requestWake(){
  try{
    if("wakeLock" in navigator){
      wakeLock=await navigator.wakeLock.request("screen");
      document.getElementById("wake-indicator").classList.add("on");
    }
  }catch(e){}
}
async function releaseWake(){
  try{if(wakeLock){await wakeLock.release();wakeLock=null;document.getElementById("wake-indicator").classList.remove("on")}}catch{}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&currentView==="training")requestWake()});

// ── DATA HELPERS ─────────────────────────────────────────────────────────────
function sessKey(day){return`${day}_${today()}`}
function getSession(day){return DB.sessions[sessKey(day)]||(DB.sessions[sessKey(day)]={date:today(),sets:{}},DB.sessions[sessKey(day)])}
function setVal(day,exId,setIdx,field,val){
  const s=getSession(day);
  if(!s.sets[exId])s.sets[exId]=[];
  while(s.sets[exId].length<=setIdx)s.sets[exId].push({weight:"",reps:"",done:false});
  s.sets[exId][setIdx][field]=val;save();
}
function toggleDone(day,exId,setIdx){
  const s=getSession(day);
  if(!s.sets[exId])s.sets[exId]=[];
  while(s.sets[exId].length<=setIdx)s.sets[exId].push({weight:"",reps:"",done:false});
  s.sets[exId][setIdx].done=!s.sets[exId][setIdx].done;
  save();
  render();
}
function getLastSession(dayId,exId){
  const keys=Object.keys(DB.sessions).filter(k=>k.startsWith(dayId+"_")).sort().reverse();
  for(const k of keys){const s=DB.sessions[k];if(s.sets&&s.sets[exId]&&s.sets[exId].length)return s.sets[exId]}
  return null;
}
function getPR(exId){
  let best=null;
  for(const k of Object.keys(DB.sessions)){
    const s=DB.sessions[k];
    if(!s.sets||!s.sets[exId])continue;
    for(const set of s.sets[exId]){
      const v=(parseFloat(set.weight)||0)*(parseInt(set.reps)||0);
      if(!best||v>best.val)best={val:v,weight:set.weight,reps:set.reps,date:s.date};
    }
  }
  return best;
}
function getProgress(exId){
  const pts=[];
  for(const k of Object.keys(DB.sessions).sort()){
    const s=DB.sessions[k];
    if(!s.sets||!s.sets[exId])continue;
    const maxW=Math.max(...s.sets[exId].map(x=>parseFloat(x.weight)||0));
    if(maxW>0)pts.push({date:s.date,weight:maxW});
  }
  return pts;
}
function getFeedback(exId,curSets,lastSets){
  if(!lastSets||!curSets)return null;
  const done=curSets.filter(s=>s.done);
  if(done.length<1)return null;
  const curMax=Math.max(...done.map(s=>parseFloat(s.weight)||0));
  const lastMax=Math.max(...lastSets.map(s=>parseFloat(s.weight)||0));
  const curReps=done.reduce((a,s)=>a+(parseInt(s.reps)||0),0);
  const lastReps=lastSets.reduce((a,s)=>a+(parseInt(s.reps)||0),0);
  if(curMax>lastMax)return{msg:`🔥 PR! +${(curMax-lastMax).toFixed(1)}kg zwaarder dan vorige sessie.`,cls:"good"};
  if(curMax===lastMax&&curReps>lastReps)return{msg:`✅ Meer reps bij zelfde gewicht — verhoog volgende keer het gewicht.`,cls:"good"};
  if(curMax>0&&curMax<lastMax)return{msg:`⚠️ Lichter dan vorige sessie. Check herstel, slaap en voeding.`,cls:"warn"};
  if(curMax>0)return{msg:`➡️ Zelfde als vorige sessie. Doel: +1 rep of +2.5kg volgende keer.`,cls:""};
  return null;
}

// ── CHART ────────────────────────────────────────────────────────────────────
function miniChart(data,color){
  if(!data||data.length<2)return`<div style="color:#444;font-size:12px;padding:12px 0">Log minimaal 2 sessies voor een grafiek.</div>`;
  const W=340,H=90,P=10;
  const weights=data.map(d=>d.weight);
  const mn=Math.min(...weights),mx=Math.max(...weights),range=mx-mn||1;
  const pts=data.map((d,i)=>{
    const x=P+(i/(data.length-1))*(W-P*2);
    const y=H-P-((d.weight-mn)/range)*(H-P*2);
    return`${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const dots=data.map((d,i)=>{
    const x=P+(i/(data.length-1))*(W-P*2);
    const y=H-P-((d.weight-mn)/range)*(H-P*2);
    return`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${color}"/>`;
  }).join("");
  return`<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}
    <text x="${P}" y="${H}" font-size="10" fill="#555">${data[0].date.slice(5)}</text>
    <text x="${W-P}" y="${H}" font-size="10" fill="#555" text-anchor="end">${data[data.length-1].date.slice(5)}</text>
    <text x="${P}" y="10" font-size="10" fill="${color}">${mx}kg</text>
  </svg></div>`;
}

// ── VIEWS ────────────────────────────────────────────────────────────────────
function renderTraining(){
  const day=SCHEMA[activeDay];
  const tabsHtml=DAYS.map(d=>{
    const active=d===activeDay;
    const col=SCHEMA[d].color;
    return`<button class="day-tab${active?" active":""}" style="${active?`border-color:${col};color:${col};background:${col}18`:""}" onclick="switchDay('${d}')">${d}<br><span style="font-size:9px;font-weight:400;opacity:.7">${SCHEMA[d].type}</span></button>`;
  }).join("");

  if(day.exercises.length===0){
    return`<div class="page-header"><div class="page-title">Training</div><div class="page-sub">${today()}</div></div>
    <div class="day-tabs">${tabsHtml}</div>
    <div class="rest-day"><div class="big">😴</div><div class="title">Rustdag — ${day.label}</div><div class="sub">Herstel is waar groei plaatsvindt.<br>Slaap 7–9 uur. Eet je eiwitten.</div></div>`;
  }

  const sess=getSession(activeDay);
  let exHtml="";
  for(const ex of day.exercises){
    const curSets=sess.sets[ex.id]||[];
    const lastSets=getLastSession(activeDay,ex.id);
    const pr=getPR(ex.id);
    const lastMax=lastSets?Math.max(...lastSets.map(s=>parseFloat(s.weight)||0)):null;
    const fb=getFeedback(ex.id,curSets,lastSets);

    let setsHtml="";
    for(let i=0;i<ex.sets;i++){
      const s=curSets[i]||{};
      const last=lastSets?.[i];
      const isDone=!!s.done;
      setsHtml+=`<div class="set-row">
        <div class="set-num">${i+1}</div>
        <input class="set-input${isDone?" done":""}" type="number" inputmode="decimal" placeholder="${last?.weight||"kg"}" value="${s.weight||""}" 
          onchange="setVal('${activeDay}','${ex.id}',${i},'weight',this.value);render()" onfocus="this.select()">
        <input class="set-input${isDone?" done":""}" type="number" inputmode="numeric" placeholder="${last?.reps||"reps"}" value="${s.reps||""}"
          onchange="setVal('${activeDay}','${ex.id}',${i},'reps',this.value);render()" onfocus="this.select()">
        <button class="done-btn${isDone?" active":""}" onclick="toggleDone('${activeDay}','${ex.id}',${i})">${isDone?"✓":"○"}</button>
      </div>`;
    }

    const fbHtml=fb?`<div class="feedback-box ${fb.cls}">${fb.msg}</div>`:"";
    const prHtml=pr?`<div class="pr-badge">🏆 PR: ${pr.weight}kg × ${pr.reps} reps</div>`:"";

    exHtml+=`<div class="card">
      <div class="ex-header">
        <div style="flex:1">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-meta">${ex.sets} sets · ${ex.reps} reps · rust ${Math.floor(ex.rest/60)}:${(ex.rest%60).toString().padStart(2,"0")} min</div>
          ${prHtml}
        </div>
        ${lastMax?`<div class="last-tag">Vorig:<br><strong>${lastMax}kg</strong></div>`:""}
      </div>
      ${setsHtml}
      ${fbHtml}
    </div>`;
  }

  return`<div class="page-header"><div class="page-title">${day.type}</div><div class="page-sub">${day.label} · ${today()}</div></div>
  <div class="day-tabs">${tabsHtml}</div>
  ${exHtml}`;
}

function renderDashboard(){
  const total=Object.keys(DB.sessions).length;
  const latestBW=DB.bodyweight?.slice(-1)[0]?.weight;
  const diff=latestBW?(latestBW-90).toFixed(1):null;

  const allEx=Object.values(SCHEMA).flatMap(d=>d.exercises);
  const prRows=allEx.map(ex=>{
    const pr=getPR(ex.id);
    if(!pr)return"";
    return`<div class="card-sm" style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:13px;color:#aaa;flex:1">${ex.name}</div>
      <div class="pr-badge">🏆 ${pr.weight}kg × ${pr.reps}</div>
    </div>`;
  }).join("");

  const bwHistory=DB.bodyweight?.slice(-8)||[];
  const bwChart=miniChart(bwHistory,"#C8873A");

  return`<div class="page-header"><div class="page-title">Dashboard</div><div class="page-sub">${today()}</div></div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-label">Sessies gelogd</div></div>
    <div class="stat-card"><div class="stat-val">${latestBW?latestBW+"kg":"—"}</div><div class="stat-label">Huidig gewicht</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#C8873A">90kg</div><div class="stat-label">Doelgewicht</div></div>
    <div class="stat-card"><div class="stat-val" style="font-size:20px">${diff!==null?(parseFloat(diff)>0?"+":"")+diff+"kg":"—"}</div><div class="stat-label">Van doel</div></div>
  </div>

  <div class="section-title">Lichaamsgewicht</div>
  <div class="bw-row">
    <input class="bw-input" type="number" inputmode="decimal" id="bw-input" placeholder="Gewicht in kg vandaag">
    <button class="add-btn" onclick="logBW()">+ Log</button>
  </div>
  ${bwHistory.length>1?`<div class="card">${bwChart}</div>`:""}

  <div class="section-title">Persoonlijke records</div>
  ${prRows||`<div style="color:#444;font-size:13px;padding:8px 0">Log je eerste sessie om PR's te zien.</div>`}`;
}

function calcDayScore(nut, steps){
  // Score uit 10: macros (60%), stappen (20%), calorieën (20%)
  if(!nut) return null;
  const goals=MACROS;
  const p=parseFloat(nut.protein)||0;
  const k=parseFloat(nut.carbs)||0;
  const v=parseFloat(nut.fat)||0;
  const kcalIn=parseFloat(nut.kcal)||Math.round(p*4+k*4+v*9);
  const st=parseInt(steps)||0;

  let scored=0, total=0;

  // Eiwit (25 punten) — meest kritisch
  if(p>0){
    const pPct=p/goals.protein;
    const pScore=pPct>=0.92&&pPct<=1.15?25:pPct>=0.80?15:pPct>=0.65?8:2;
    scored+=pScore; total+=25;
  }

  // Calorieën (20 punten)
  if(kcalIn>0){
    const cPct=kcalIn/goals.kcal;
    const cScore=cPct>=0.90&&cPct<=1.08?20:cPct>=0.80&&cPct<=1.15?13:cPct>=0.70?6:2;
    scored+=cScore; total+=20;
  }

  // Koolhydraten (10 punten)
  if(k>0){
    const kPct=k/goals.carbs;
    const kScore=kPct>=0.88&&kPct<=1.12?10:kPct>=0.70?6:3;
    scored+=kScore; total+=10;
  }

  // Vetten (5 punten)
  if(v>0){
    const vPct=v/goals.fat;
    const vScore=vPct>=0.85&&vPct<=1.20?5:3;
    scored+=vScore; total+=5;
  }

  // Stappen (20 punten) — doel 8000+
  if(st>0){
    const sScore=st>=10000?20:st>=8000?17:st>=6000?12:st>=4000?7:3;
    scored+=sScore; total+=20;
  }

  if(total===0) return null;
  const raw=Math.round((scored/total)*10*10)/10;
  return Math.min(raw,10);
}

function scoreColor(s){
  if(s>=9)return"#3A9B6F";
  if(s>=7.5)return"#7BC67A";
  if(s>=6)return"#C8873A";
  if(s>=4.5)return"#cc8833";
  return"#cc4444";
}

function scoreLabel(s){
  if(s>=9)return"Perfecte dag 🔥";
  if(s>=7.5)return"Sterke dag ✅";
  if(s>=6)return"Redelijke dag";
  if(s>=4.5)return"Matige dag ⚠️";
  return"Zwakke dag ❌";
}

function renderNutrition(){
  const nutKey=today();
  const nut=DB.nutrition[nutKey]||{};
  const steps=DB.steps?.[nutKey]||"";
  const goals=MACROS;
  const p=parseFloat(nut.protein)||0;
  const k=parseFloat(nut.carbs)||0;
  const v=parseFloat(nut.fat)||0;
  const kcal=parseFloat(nut.kcal)||0;
  const calcKcal=Math.round(p*4+k*4+v*9);
  const st=parseInt(steps)||0;
  const score=calcDayScore(nut,steps);

  function bar(val,goal,color){
    const pct=Math.min((val/goal)*100,100);
    return`<div class="macro-bar"><div class="macro-fill" style="width:${pct}%;background:${color}"></div></div>`;
  }

  const macros=[
    {field:"protein",label:"Eiwit",unit:"g",color:"#C8873A",val:p,goal:goals.protein},
    {field:"carbs",label:"Koolhydraten",unit:"g",color:"#7B6FD4",val:k,goal:goals.carbs},
    {field:"fat",label:"Vetten",unit:"g",color:"#3A9B6F",val:v,goal:goals.fat},
    {field:"kcal",label:"Calorieën",unit:"kcal",color:"#888",val:kcal||calcKcal,goal:goals.kcal},
  ];

  // Gedetailleerde feedback regels
  const feedbackLines=[];
  for(const m of macros){
    if(!m.val)continue;
    const diff=m.val-m.goal;
    const pct=Math.round((m.val/m.goal)*100);
    let msg,col;
    if(pct>=92&&pct<=108){msg=`✅ ${m.label} op schema`;col="#3A9B6F"}
    else if(m.val<m.goal){msg=`⬇️ ${m.label} ${Math.abs(diff).toFixed(0)}${m.unit} te laag`;col="#C8873A"}
    else{msg=`⬆️ ${m.label} ${Math.abs(diff).toFixed(0)}${m.unit} te hoog`;col="#7B6FD4"}
    feedbackLines.push({msg,col});
  }
  if(st>0){
    if(st>=10000)feedbackLines.push({msg:`✅ Stappen: ${st.toLocaleString()} — uitstekend`,col:"#3A9B6F"});
    else if(st>=8000)feedbackLines.push({msg:`✅ Stappen: ${st.toLocaleString()} — goed`,col:"#7BC67A"});
    else if(st>=6000)feedbackLines.push({msg:`➡️ Stappen: ${st.toLocaleString()} — probeer 8.000+ te halen`,col:"#C8873A"});
    else feedbackLines.push({msg:`⬇️ Stappen: ${st.toLocaleString()} — te weinig beweging`,col:"#cc4444"});
  }
  const feedbackHtml=feedbackLines.map((f,i)=>`<div style="font-size:13px;color:${f.col};padding:6px 0;border-bottom:${i<feedbackLines.length-1?"1px solid #1c1c1c":"none"}">${f.msg}</div>`).join("");

  // Score blok
  const scoreHtml=score!==null?`<div style="display:flex;align-items:center;justify-content:space-between;background:#111;border-radius:12px;padding:14px 16px;margin-bottom:12px;border:1px solid #222">
    <div>
      <div style="font-size:11px;color:#555;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Dagcijfer</div>
      <div style="font-size:13px;color:${scoreColor(score)}">${scoreLabel(score)}</div>
    </div>
    <div style="font-size:48px;font-weight:800;color:${scoreColor(score)};line-height:1">${score.toFixed(1)}</div>
  </div>`:"";

  const history=Object.entries(DB.nutrition).sort(([a],[b])=>b.localeCompare(a)).slice(0,7);
  const histHtml=history.map(([date,n])=>{
    const pp=parseFloat(n.protein)||0;
    const kk=parseFloat(n.carbs)||0;
    const vv=parseFloat(n.fat)||0;
    const kc=parseFloat(n.kcal)||Math.round(pp*4+kk*4+vv*9);
    const st2=parseInt(DB.steps?.[date])||0;
    const sc=calcDayScore(n,DB.steps?.[date]);
    return`<div class="card-sm">
      <div class="history-row">
        <div>
          <div style="font-size:13px;font-weight:700;color:${date===nutKey?"#C8873A":"#f0f0f0"}">${date}${date===nutKey?" · vandaag":""}</div>
          <div style="font-size:11px;color:#555;margin-top:2px">P${pp}g · K${kk}g · V${vv}g${st2?` · 👟${st2.toLocaleString()}`:""}</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:800;font-size:14px">${kc} kcal</div>
          ${sc!==null?`<div style="font-size:14px;font-weight:800;color:${scoreColor(sc)};margin-top:2px">${sc.toFixed(1)}</div>`:""}
        </div>
      </div>
    </div>`;
  }).join("");

  return`<div class="page-header"><div class="page-title">Voeding & Dag</div><div class="page-sub">Doel: ${goals.kcal} kcal · P${goals.protein} K${goals.carbs} V${goals.fat}</div></div>

  ${scoreHtml}

  <div class="card">
    <div style="font-weight:800;font-size:15px;margin-bottom:14px">Vandaag <span style="font-size:11px;font-weight:400;color:#555">${nutKey}</span></div>
    <div class="nut-grid">
      ${macros.map(m=>`<div class="nut-field">
        <label style="color:${m.color}">${m.label} (${m.unit})</label>
        <input class="nut-input${nut[m.field]?" filled":""}" type="number" inputmode="decimal"
          placeholder="doel: ${m.goal}" value="${nut[m.field]||""}"
          id="nut-${m.field}"
          onchange="updateNut('${m.field}',this.value)">
      </div>`).join("")}
      <div class="nut-field" style="grid-column:1/-1">
        <label style="color:#888">👟 Stappen vandaag</label>
        <input class="nut-input${steps?" filled":""}" type="number" inputmode="numeric"
          placeholder="bijv. 8500" value="${steps||""}"
          id="steps-input"
          onchange="updateSteps(this.value)">
      </div>
    </div>
    ${calcKcal>0&&!nut.kcal?`<div style="font-size:12px;color:#555;margin:0 0 12px">Berekend: <strong style="color:#C8873A">${calcKcal} kcal</strong></div>`:""}
    ${macros.slice(0,3).map(m=>`<div class="macro-row">
      <div class="macro-label-row">
        <span style="color:#666;font-size:12px">${m.label}</span>
        <span style="color:${m.color};font-weight:700;font-size:12px">${m.val||0}${m.unit} <span style="color:#444">/ ${m.goal}${m.unit}</span></span>
      </div>
      ${bar(m.val,m.goal,m.color)}
    </div>`).join("")}
    ${st>0?`<div class="macro-row">
      <div class="macro-label-row">
        <span style="color:#666;font-size:12px">Stappen</span>
        <span style="color:#888;font-weight:700;font-size:12px">${st.toLocaleString()} <span style="color:#444">/ 8.000</span></span>
      </div>
      <div class="macro-bar"><div class="macro-fill" style="width:${Math.min((st/8000)*100,100)}%;background:#888"></div></div>
    </div>`:""}
  </div>

  ${feedbackLines.length?`<div class="card" style="background:#111;padding:12px 16px">${feedbackHtml}</div>`:""}

  <div class="section-title">Geschiedenis (7 dagen)</div>
  ${histHtml||`<div style="color:#444;font-size:13px;padding:8px 0">Nog niets gelogd.</div>`}`;
}

function renderProgress(){
  const allEx=Object.values(SCHEMA).flatMap(d=>d.exercises);
  const opts=allEx.map(ex=>`<option value="${ex.id}"${progressEx===ex.id?" selected":""}>${ex.name}</option>`).join("");

  let chartHtml="";
  if(progressEx){
    const ex=allEx.find(e=>e.id===progressEx);
    const pts=getProgress(progressEx);
    const pr=getPR(progressEx);
    chartHtml=`<div class="card">
      <div style="font-weight:700;margin-bottom:8px">${ex?.name}</div>
      ${pr?`<div class="pr-badge" style="margin-bottom:12px">🏆 PR: ${pr.weight}kg × ${pr.reps} reps · ${pr.date}</div>`:""}
      ${miniChart(pts,SCHEMA[Object.values(SCHEMA).find(d=>d.exercises.some(e=>e.id===progressEx))?.exercises?.[0]?.id??"Ma"]?.color||"#C8873A")}
    </div>`;
  }

  const volHtml=DAYS.filter(d=>SCHEMA[d].exercises.length>0).map(d=>{
    const keys=Object.keys(DB.sessions).filter(k=>k.startsWith(d+"_")).sort().reverse();
    const last=keys[0]?DB.sessions[keys[0]]:null;
    const sets=last?Object.values(last.sets||{}).reduce((a,ss)=>a+ss.filter(s=>s.done).length,0):0;
    return`<div class="card-sm" style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-weight:700;font-size:13px">${SCHEMA[d].label}</div>
        <div style="font-size:11px;color:#555">${SCHEMA[d].type}</div>
      </div>
      <div style="text-align:right">
        <div style="font-weight:800;color:${sets>0?"#C8873A":"#333"}">${sets>0?sets+" sets":"—"}</div>
        <div style="font-size:10px;color:#555">${last?.date||"Nog niet gelogd"}</div>
      </div>
    </div>`;
  }).join("");

  return`<div class="page-header"><div class="page-title">Progressie</div></div>

  <div class="section-title">Oefening kiezen</div>
  <select class="ex-select" onchange="progressEx=this.value;render()"><option value="">Kies een oefening...</option>${opts}</select>
  ${chartHtml}

  <div class="section-title" style="margin-top:8px">Wekelijks volume</div>
  ${volHtml}`;
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  const main=document.getElementById("main");
  if(currentView==="training")main.innerHTML=renderTraining();
  else if(currentView==="dashboard")main.innerHTML=renderDashboard();
  else if(currentView==="nutrition")main.innerHTML=renderNutrition();
  else if(currentView==="progress")main.innerHTML=renderProgress();
}

function setView(v){
  currentView=v;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
  if(v==="training")requestWake();else releaseWake();
  render();
}

function switchDay(d){activeDay=d;render()}

function logBW(){
  const inp=document.getElementById("bw-input");
  if(!inp||!inp.value)return;
  DB.bodyweight=DB.bodyweight||[];
  DB.bodyweight.push({date:today(),weight:parseFloat(inp.value)});
  save();render();
}

function updateNut(field,val){
  DB.nutrition=DB.nutrition||{};
  const key=today();
  DB.nutrition[key]=DB.nutrition[key]||{};
  DB.nutrition[key][field]=val;
  save();
  // live update bars without full re-render
  renderNutBars();
}

function updateSteps(val){
  DB.steps=DB.steps||{};
  DB.steps[today()]=val;
  save();
  renderNutBars();
}

function renderNutBars(){
  if(currentView==="nutrition"){
    const main=document.getElementById("main");
    const scrollY=main.scrollTop;
    main.innerHTML=renderNutrition();
    main.scrollTop=scrollY;
  }
}

// ── INIT ─────────────────────────────────────────────────────────────────────
requestWake();
render();
</script>
